# Xử lý ảnh món tự động.
#
# Lý do tồn tại: quy trình cũ bắt phải có máy có Node, chạy `npm install -D sharp`
# rồi `npm run menu:photos`. Chủ quán làm việc hoàn toàn qua giao diện web GitHub
# nên không chạy được bước nào cả — và nếu chỉ upload ảnh vào public/images/menu/
# thì manifest src/domain/menu-images.js vẫn rỗng, KHÔNG món nào hiện ảnh. Upload
# xong tưởng hỏng, thật ra là thiếu một bước không bấm được bằng chuột.
#
# Cách dùng: kéo thả ảnh vào thư mục anh-mon-goc/, đặt tên theo MÃ MÓN
# (pho-bo.jpg, bun-bo.png, ...). Xem HUONG-DAN-ANH-MON.md để tra mã.
# Ảnh chụp bằng điện thoại cỡ nào cũng được — workflow tự xoay theo EXIF, cắt
# vuông và nén xuống 500×500 WebP (~40 KB/ảnh).
name: Ảnh món

on:
  push:
    paths:
      - 'anh-mon-goc/**'
  workflow_dispatch:

# Cần quyền ghi để commit ngược ảnh đã nén và manifest vừa sinh.
permissions:
  contents: write

# Hai lần đẩy ảnh liên tiếp thì chỉ chạy lần cuối, khỏi chen nhau lúc commit.
concurrency:
  group: anh-mon
  cancel-in-progress: true

jobs:
  xu-ly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Cài phụ thuộc
        run: |
          npm ci
          # sharp cố ý không nằm trong package.json: nó kéo theo binary nặng mà
          # server production không bao giờ dùng tới. Chỉ cài ở đây.
          npm install --no-save sharp

      - name: Nén ảnh và sinh lại manifest
        run: node scripts/menu-photos.js ./anh-mon-goc

      - name: Chạy test
        # menu-photos.js tự chết nếu hai món dùng chung một tấm ảnh, nhưng test
        # còn bắt được đường dẫn ảnh sai định dạng — rẻ, nên chạy trước khi commit.
        run: npm test

      - name: Commit kết quả
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/images/menu src/domain/menu-images.js
          # Không đụng vào anh-mon-goc/. Workflow chỉ chạy khi thư mục đó đổi, nên
          # commit này không tự kích hoạt lại chính nó.
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi — ảnh đã được xử lý từ trước."
            exit 0
          fi
          git commit -m "chore: nén ảnh món và cập nhật menu-images.js [tự động]"
          git push
